version: '3.8'

services:
  # Django Web Application
  web:
    build: .
    container_name: gethub_web
    restart: unless-stopped
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/assets
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - pg-admin_default

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gethub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/get-hub.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/assets:ro
      - media_volume:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - pg-admin_default

volumes:
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  pg-admin_default:
    external: true
